name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"

jobs:
  changes:
    name: Check changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Check out pull request history
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Identify plan-only pull requests
        id: changes
        shell: bash
        run: |
          docs_only=false
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
            docs_only=true
            changed=false
            while IFS= read -r -d '' path; do
              changed=true
              case "$path" in
                docs/plans/*.md) ;;
                *) docs_only=false ;;
              esac
            done < "$RUNNER_TEMP/changed-files"
            if [[ "$changed" == "false" ]]; then
              docs_only=false
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - name: Check plan formatting
        if: steps.changes.outputs.docs_only == 'true'
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  quality:
    name: Quality
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Check types
        run: uv run ty check --python-version 3.13 src tests

      - name: Check lint
        run: uv run ruff check

      - name: Check example sources
        run: uv run --frozen too parse examples --check

      - name: Export runtime dependencies
        run: >-
          uv export --frozen --no-dev --no-emit-project
          --output-file "${RUNNER_TEMP}/requirements-audit.txt"

      - name: Audit runtime dependencies
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit
          --requirement "${RUNNER_TEMP}/requirements-audit.txt"
          --disable-pip

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
        exclude: >-
          ${{ github.event_name == 'pull_request'
              && fromJSON('[{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.13"},{"os":"macos-latest","python-version":"3.11"},{"os":"macos-latest","python-version":"3.12"}]')
              || fromJSON('[]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Ubuntu's tmux 3.4 can lose SIGCHLD with utempter (tmux/tmux#4559).
      - name: Install tmux for Linux integration tests
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tmux.tar.gz" \
            https://github.com/tmux/tmux-builds/releases/download/v3.7c/tmux-3.7c-linux-x86_64.tar.gz
          echo "cc56bd1cc873eb6089c615f0496b072385bda8a6d944069f38564a5d49c128aa  $RUNNER_TEMP/tmux.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/tmux"
          tar -xzf "$RUNNER_TEMP/tmux.tar.gz" -C "$RUNNER_TEMP/tmux"
          echo "$RUNNER_TEMP/tmux" >> "$GITHUB_PATH"

      - name: Run tests
        timeout-minutes: 12
        shell: bash
        env:
          TOOLANG_TEST_DIAGNOSTICS: ${{ runner.temp }}/test-results
        run: |
          mkdir -p "$TOOLANG_TEST_DIAGNOSTICS"
          uv run --frozen pytest -q -n auto \
            -p tests.support.ci_diagnostics \
            --ci-diagnostics-dir="$TOOLANG_TEST_DIAGNOSTICS" \
            --max-worker-restart=0 --durations=30 \
            --junitxml="$TOOLANG_TEST_DIAGNOSTICS/junit.xml" \
            -o faulthandler_timeout=60 -o faulthandler_exit_on_timeout=true \
            2>&1 | tee "$TOOLANG_TEST_DIAGNOSTICS/pytest.log"

      - name: Smoke-test macOS wheel installation
        if: runner.os == 'macOS' && matrix.python-version == '3.13'
        shell: bash
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/install-smoke-dist"
          uv venv --python 3.13 "$RUNNER_TEMP/install-smoke"
          uv pip install --python "$RUNNER_TEMP/install-smoke/bin/python" \
            --index-url https://pypi.org/simple --prerelease=allow \
            "$RUNNER_TEMP"/install-smoke-dist/*.whl
          "$RUNNER_TEMP/install-smoke/bin/too" --version
          "$RUNNER_TEMP/install-smoke/bin/too" --help > /dev/null

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/test-results
          retention-days: 7

  docker:
    name: Docker foreground lifecycle (Linux)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Exercise Docker with deterministic providers
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/docker-results"
          docker version
          uv run --frozen pytest --live-docker -q \
            tests/integration/up/test_docker_sandbox_lifecycle.py \
            -k 'home_reuse_resolves or owner_loss_finalizes or script_runs_with_a_temporary or run_interrupt_stops or killed_temporary_controller or host_script_ctrl_c or distinct_homes_run or foreground_launch_preserves or owner_eof_stops or root_guest_runtime_data' \
            --junitxml="$RUNNER_TEMP/docker-results/junit.xml" \
            --durations=20 2>&1 | tee "$RUNNER_TEMP/docker-results/pytest.log"

      - name: Upload Docker diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-results-linux
          path: ${{ runner.temp }}/docker-results
          retention-days: 7

  package:
    name: Package
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uvx --from twine==7.0.0 twine check dist/*

  gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - changes
      - quality
      - tests
      - docker
      - package
    runs-on: ubuntu-latest

    steps:
      - name: Require the expected CI jobs to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          case "$DOCS_ONLY" in
            true)
              test "$GITHUB_EVENT_NAME" = "pull_request"
              expected=skipped
              ;;
            false) expected=success ;;
            *) exit 1 ;;
          esac
          test "$QUALITY_RESULT" = "$expected"
          test "$TESTS_RESULT" = "$expected"
          test "$DOCKER_RESULT" = "$expected"
          test "$PACKAGE_RESULT" = "$expected"
