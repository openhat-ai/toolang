name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Check types
        run: uv run ty check --python-version 3.13 src tests

      - name: Check lint
        run: uv run ruff check

      - name: Export runtime dependencies
        run: |
          mkdir -p "${RUNNER_TEMP}/runtime-audit"
          uv export --frozen --no-dev --no-emit-project --quiet --format pylock.toml \
            --output-file "${RUNNER_TEMP}/runtime-audit/pylock.toml"

      - name: Audit runtime dependencies
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit
          --locked "${RUNNER_TEMP}/runtime-audit"

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Ubuntu's tmux 3.4 can lose SIGCHLD with utempter (tmux/tmux#4559).
      - name: Install tmux for Linux integration tests
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tmux.tar.gz" \
            https://github.com/tmux/tmux-builds/releases/download/v3.7c/tmux-3.7c-linux-x86_64.tar.gz
          echo "cc56bd1cc873eb6089c615f0496b072385bda8a6d944069f38564a5d49c128aa  $RUNNER_TEMP/tmux.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/tmux"
          tar -xzf "$RUNNER_TEMP/tmux.tar.gz" -C "$RUNNER_TEMP/tmux"
          echo "$RUNNER_TEMP/tmux" >> "$GITHUB_PATH"

      - name: Run tests
        run: uv run --frozen pytest -q

  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uvx --from twine==7.0.0 twine check dist/*

  gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - quality
      - tests
      - package
    runs-on: ubuntu-latest

    steps:
      - name: Require every CI job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$TESTS_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
