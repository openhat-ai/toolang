[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "toolang"
version = "0.1.0"
description = "Toolang runtime and CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.0,<2",
    "python-frontmatter>=1.1.0",
    "tomli>=2.2.1 ; python_full_version < '3.11'",
    "tomli-w>=1.2.0",
    "tree-sitter>=0.24,<0.26",
    "typer>=0.16,<1",
]

[project.scripts]
toolang = "toolang.cli:main"

[dependency-groups]
dev = [
  "openai>=1.109.1",
  "pytest>=8.3.5",
  "ruff>=0.15.6",
  "tree-sitter-toolang>=0.0.5",
  "ty>=0.0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toolang", "src/toolang_caps"]

[tool.uv.sources]
tree-sitter-toolang = { path = "../tree-sitter-toolang" }

[tool.ruff]
exclude = ["archive", "dist", "scratch"]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
