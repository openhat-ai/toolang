[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "toolang"
version = "0.2.7"
description = "A programming language and runtime for agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Brice Yan" },
]
keywords = ["agents", "automation", "cli", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "dataclasses-json>=0.6,<1.0",
    "python-dateutil>=2.9,<3",
    "ddgs>=9.13.0",
    "fastapi>=0.135,<1",
    "fastmcp>=3.0,<4.0",
    "humanize>=4.12,<5",
    "httpx>=0.28.1",
    "mcat-cli>=0.2.0",
    "mstache>=0.3,<1",
    "json5>=0.12,<1.0",
    "openai>=1.109.1",
    "pydantic>=2.11,<3",
    "prompt-toolkit>=3.0,<4",
    "python-dotenv>=1.0,<2",
    "python-frontmatter>=1.1.0",
    "rich>=14,<15",
    "tomlkit>=0.13,<1",
    "tree-sitter>=0.24,<0.26",
    "tree-sitter-toolang>=0.2.1",
    "wcwidth>=0.8,<1",
    "typer>=0.16,<1",
    "uvicorn>=0.35,<1",
    "watchfiles>=1.1,<2",
]

[project.urls]
Homepage = "https://toolang.ai/"
Documentation = "https://toolang.ai/docs"
Repository = "https://github.com/openhat-ai/toolang"
Issues = "https://github.com/openhat-ai/toolang/issues"

[project.scripts]
toolang = "toolang.cli.toolang.main:main"
too = "toolang.cli.toolang.main:main"
caps = "toolang.cli.caps.main:main"

[project.entry-points."toolang.tool"]
filesystem = "toolang.plugin.tools.filesystem:create_tool_set"
service_use = "toolang.plugin.tools.service_use:create_tool_set"
shell = "toolang.plugin.tools.shell:create_tool_set"
web_search = "toolang.plugin.tools.web_search:create_tool_set"
agent_state = "toolang.execution.tools.agent_state:create_tool_set"

[project.entry-points."toolang.model_provider"]
custom = "toolang.plugin.models.providers.custom:create_model_provider"
deepseek = "toolang.plugin.models.providers.deepseek:create_model_provider"
google = "toolang.plugin.models.providers.google:create_model_provider"
openai = "toolang.plugin.models.providers.openai:create_model_provider"
openrouter = "toolang.plugin.models.providers.openrouter:create_model_provider"
ollama = "toolang.plugin.models.providers.ollama:create_model_provider"

[project.entry-points."toolang.model_adapter"]
chat_completions = "toolang.plugin.models.adapters.chat_completions:create_model_adapter"
responses = "toolang.plugin.models.adapters.responses:create_model_adapter"

[project.entry-points."toolang.channel"]
telegram = "toolang.plugin.channels.telegram:create_channel"

[project.entry-points."toolang.sandbox"]
none = "toolang.plugin.sandboxes.none:create_hosting"
docker = "toolang.plugin.sandboxes.docker:create_hosting"

[dependency-groups]
dev = [
  "pdoc>=15,<16",
  "pytest>=8.3.5",
  "ruff>=0.15.6",
  "ty>=0.0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toolang"]

[tool.ruff]
exclude = ["archive", "dist", "scratch"]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_provider: opt-in smoke tests that call a real model provider",
]
